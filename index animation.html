<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Birthday My Love</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at center,#651b39,#240b20 65%,#100610);color:#fff1db;font-family:Georgia,serif;overflow-x:hidden}main{position:relative;z-index:2;text-align:center;width:min(94vw,620px);padding:24px}h1{font-weight:normal;font-style:italic;font-size:clamp(24px,6vw,40px)}button{cursor:pointer;background:#a83259;color:white;border:1px solid #ffb3cc;border-radius:40px;padding:16px 28px;font:inherit;box-shadow:0 0 25px #ff528744}svg{width:100%;max-height:65svh;overflow:visible}.heart{transform-origin:180px 150px;animation:beat 1.4s infinite}.petal,.star{position:fixed;pointer-events:none}.petal{top:-35px;animation:fall linear infinite;background:linear-gradient(135deg,#ff9dbb,#a51942);border-radius:80% 20% 65% 35%;width:14px;height:21px}.star{background:#ffe4b5;border-radius:50%;box-shadow:0 0 8px #ffe4b5;animation:twinkle 2s infinite alternate}#surprise[hidden]{display:none}#surprise{animation:appear 1s ease} @keyframes appear{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}@keyframes beat{0%,100%{transform:scale(1)}15%,42%{transform:scale(1.045)}28%,65%{transform:scale(1)}}@keyframes fall{to{transform:translate(35px,110vh) rotate(420deg)}}@keyframes twinkle{from{opacity:.15}to{opacity:1}} .heart{transform-box:view-box;transform-origin:50% 50%;animation:beatStrong 1.3s ease-in-out infinite} @keyframes beatStrong{0%,100%{transform:scale(.94)}14%{transform:scale(1.09)}30%{transform:scale(.96)}46%{transform:scale(1.07)}70%{transform:scale(.94)}} .petal{background:none;border-radius:0;width:32px;height:36px;top:-45px;animation-name:drift;z-index:1} .petal svg{width:100%;height:100%;overflow:visible} @keyframes drift{0%{transform:translate(0,-10px) rotate(0deg)}25%{transform:translate(24px,27vh) rotate(90deg)}50%{transform:translate(-18px,55vh) rotate(180deg)}75%{transform:translate(20px,83vh) rotate(270deg)}100%{transform:translate(0,115vh) rotate(360deg)}} body.paused *{animation-play-state:paused!important} #motion{position:fixed;bottom:12px;right:12px;z-index:4;font-size:12px;padding:8px 12px}
</style></head><body><main><section id="opening"><div style="font-size:70px;color:#ff99b9">♡</div><h1>For my love</h1><p style="font-style:italic">I have a little surprise for you...</p><button id="reveal">Open your surprise ♡</button></section><section id="surprise" hidden><svg viewBox="0 0 360 310" role="img" aria-label="Glowing beating heart saying Happy Birthday My Love, I Love You"><defs><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter></defs><g class="heart" fill="none"><path id="outline" d="M180 285 C145 255 30 170 30 100 C30 24 130 10 180 80 C230 10 330 24 330 100 C330 170 215 255 180 285Z" stroke="#ff5287" stroke-width="10" filter="url(#glow)"/><path d="M180 285 C145 255 30 170 30 100 C30 24 130 10 180 80 C230 10 330 24 330 100 C330 170 215 255 180 285Z" stroke="#ffb3cc" stroke-width="2"/></g><g text-anchor="middle" font-family="Georgia,serif" font-style="italic"><text x="180" y="124" fill="#fff1db" font-size="24">Happy Birthday!</text><text x="180" y="166" fill="#ffc0d5" font-size="39">My Love</text><text x="180" y="204" fill="#fff1db" font-size="24">I Love You</text><text x="180" y="239" fill="#ff91b5" font-size="25">♡</text></g></svg><p style="font-style:italic;font-size:20px;color:#f4cfa5">Forever and always ♡</p></section></main><button id="motion" aria-pressed="false">Pause animation</button><script>document.getElementById('reveal').addEventListener('click',()=>{document.getElementById('opening').hidden=true;document.getElementById('surprise').hidden=false});for(let i=0;i<45;i++){let s=document.createElement('span');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.width=s.style.height=1+Math.random()*3+'px';s.style.animationDelay=-Math.random()*3+'s';document.body.append(s)}for(let i=0;i<28;i++){let p=document.createElement('span');p.className='petal';p.innerHTML=i%4===0?`<svg viewBox="0 0 40 40"><g fill="#b51e49" stroke="#ff86a6" stroke-width=".7"><path d="M20 35C3 30 1 16 10 10C8 2 23 0 27 9C40 7 43 25 30 31Z"/><path d="M20 30C5 23 12 8 23 12C36 15 31 28 20 30Z" fill="#dc4169"/><path d="M20 25C12 20 19 12 25 17C31 23 22 28 20 25Z" fill="#f77b98"/></g></svg>`:`<svg viewBox="0 0 40 40"><path d="M20 35C3 23 0 9 12 5C19 1 22 9 26 5C39 2 43 22 20 35Z" fill="#e85a80"/><path d="M20 35Q10 19 12 5" fill="none" stroke="#ffb3cc"/></svg>`;p.style.left=(i%2?Math.random()*18:82+Math.random()*16)+'%';p.style.animationDuration=4+Math.random()*5+'s';p.style.animationDelay=-Math.random()*12+'s';p.style.opacity=.4+Math.random()*.6;document.body.append(p)}document.getElementById('motion').onclick=function(){let paused=document.body.classList.toggle('paused');this.textContent=paused?'Play animation':'Pause animation';this.setAttribute('aria-pressed',String(paused))};</script></body></html>
