<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Birthday Laaiqah</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at center,#651b39,#240b20 65%,#100610);color:#fff1db;font-family:Georgia,serif;overflow-x:hidden}main{position:relative;z-index:2;text-align:center;width:min(94vw,620px);padding:24px}h1{font-weight:normal;font-style:italic;font-size:clamp(24px,6vw,40px)}button{cursor:pointer;background:#a83259;color:white;border:1px solid #ffb3cc;border-radius:40px;padding:16px 28px;font:inherit;box-shadow:0 0 25px #ff528744}svg{width:100%;max-height:65svh;overflow:visible}.heart{transform-origin:180px 150px;animation:beat 1.4s infinite}.petal,.star{position:fixed;pointer-events:none}.petal{top:-35px;animation:fall linear infinite;background:linear-gradient(135deg,#ff9dbb,#a51942);border-radius:80% 20% 65% 35%;width:14px;height:21px}.star{background:#ffe4b5;border-radius:50%;box-shadow:0 0 8px #ffe4b5;animation:twinkle 2s infinite alternate}#surprise[hidden]{display:none}#surprise{animation:appear 1s ease} @keyframes appear{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}@keyframes beat{0%,100%{transform:scale(1)}15%,42%{transform:scale(1.045)}28%,65%{transform:scale(1)}}@keyframes fall{to{transform:translate(35px,110vh) rotate(420deg)}}@keyframes twinkle{from{opacity:.15}to{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.petal{display:none}}
</style></head><body><main><section id="opening"><div style="font-size:70px;color:#ff99b9">♡</div><h1>For my beautiful Laaiqah</h1><p style="font-style:italic">I have a little surprise for you...</p><button id="reveal">Open your surprise ♡</button></section><section id="surprise" hidden><svg viewBox="0 0 360 310" role="img" aria-label="Glowing beating heart saying Happy Birthday Laaiqah, I Love You"><defs><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter></defs><g class="heart" fill="none"><path id="outline" d="M180 285 C145 255 30 170 30 100 C30 24 130 10 180 80 C230 10 330 24 330 100 C330 170 215 255 180 285Z" stroke="#ff5287" stroke-width="10" filter="url(#glow)"/><use href="#outline" stroke="#ff9dbb"/><path d="M180 285 C145 255 30 170 30 100 C30 24 130 10 180 80 C230 10 330 24 330 100 C330 170 215 255 180 285Z" stroke="#ffb3cc" stroke-width="2"/></g><g text-anchor="middle" font-family="Georgia,serif" font-style="italic"><text x="180" y="124" fill="#fff1db" font-size="24">Happy Birthday!</text><text x="180" y="166" fill="#ffc0d5" font-size="39">Laaiqah</text><text x="180" y="204" fill="#fff1db" font-size="24">I Love You</text><text x="180" y="239" fill="#ff91b5" font-size="25">♡</text></g></svg><p style="font-style:italic;font-size:20px;color:#f4cfa5">Forever and always ♡</p></section></main><script>document.getElementById('reveal').addEventListener('click',()=>{document.getElementById('opening').hidden=true;document.getElementById('surprise').hidden=false});for(let i=0;i<45;i++){let s=document.createElement('span');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.width=s.style.height=1+Math.random()*3+'px';s.style.animationDelay=-Math.random()*3+'s';document.body.append(s)}for(let i=0;i<28;i++){let p=document.createElement('span');p.className='petal';p.style.left=(i%2?Math.random()*18:82+Math.random()*16)+'%';p.style.animationDuration=5+Math.random()*7+'s';p.style.animationDelay=-Math.random()*12+'s';p.style.opacity=.4+Math.random()*.6;document.body.append(p)}</script></body></html>
